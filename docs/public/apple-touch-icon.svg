<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="100%" stop-color="#764ba2" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="1.8"/></feComponentTransfer>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)"/>
  <g transform="translate(90, 90)" filter="url(#iconGlow)">
    <path d="M -35 -35 V 20 H -12" stroke="url(#iconGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 35 -35 L -12 30 H 35" stroke="url(#iconGrad)" stroke-width="3" stroke-linecap="square" fill="none" opacity="0.9"/>
    <circle r="6" fill="#FFFFFF"/>
  </g>
</svg>
